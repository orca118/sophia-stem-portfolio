<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 840" width="100%" height="100%">
  <!-- Document Sheet -->
  <rect width="650" height="840" fill="#FFFFFF" rx="4" />
  <rect x="0" y="0" width="650" height="840" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Journal Header Banner: Journal of Emerging Investigators -->
  <rect x="40" y="32" width="570" height="54" fill="#F8FAFC" rx="4" stroke="#E2E8F0" stroke-width="1" />
  
  <!-- JEI Logo Badge -->
  <rect x="52" y="42" width="46" height="34" rx="4" fill="#0F766E" />
  <text x="75" y="64" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JEI</text>
  
  <!-- Journal Text -->
  <text x="110" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F766E" letter-spacing="0.5">JOURNAL OF EMERGING INVESTIGATORS</text>
  <text x="110" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">PUBLISHED AUGUST 6, 2026 · ARTICLE ID: 25-295 · PEER-REVIEWED RESEARCH</text>
  <text x="596" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#0F766E" text-anchor="end">OPEN ACCESS</text>

  <!-- Article Title -->
  <text x="40" y="124" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="18.5" font-weight="800" fill="#0F172A" text-anchor="start">
    <tspan x="40" dy="0">Integrated Expression, Mutation, and Survival</tspan>
    <tspan x="40" dy="25">Analysis of 17 Key Genes in Breast Cancer</tspan>
    <tspan x="40" dy="25">Using TCGA-BRCA Data</tspan>
  </text>

  <!-- Authors & Affiliations -->
  <text x="40" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0F766E">
    Sophia Wang<tspan font-size="8.5" dy="-4">1*</tspan><tspan font-size="11.5" dy="4">, Christopher Wang</tspan><tspan font-size="8.5" dy="-4">2</tspan><tspan font-size="11.5" dy="4">, Haiyan Lei</tspan><tspan font-size="8.5" dy="-4">1,3</tspan>
  </text>
  
  <text x="40" y="228" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#64748B">
    <tspan font-weight="600">1</tspan> Richard Montgomery High School, Rockville, MD · <tspan font-weight="600">2</tspan> Montgomery Blair High School, Silver Spring, MD
  </text>
  <text x="40" y="242" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#0F766E">
    3 Research Mentor: Dr. Haiyan Lei · National Cancer Institute (NCI)
  </text>
  <line x1="40" y1="254" x2="610" y2="254" stroke="#E2E8F0" stroke-width="1" />

  <!-- Summary / Abstract Callout Box -->
  <rect x="40" y="262" width="570" height="152" fill="#F0FDFA" rx="6" stroke="#CCFBF1" stroke-width="1" />
  <text x="56" y="284" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#0F766E" letter-spacing="0.5">SUMMARY &amp; ABSTRACT</text>
  
  <text x="56" y="304" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#334155" line-height="1.5">
    <tspan x="56" dy="0">Breast cancer remains the most prevalent cancer among women globally, often characterized</tspan>
    <tspan x="56" dy="15">by complex genomic alterations. In this study, we investigated 17 clinically significant genes—</tspan>
    <tspan x="56" dy="15">spanning oncogenes (ERBB2, CCND1), tumor suppressors (TP53, BRCA1, BRCA2, CHEK2), and</tspan>
    <tspan x="56" dy="15">hormone receptors (ESR1, PGR)—to evaluate their transcriptional dysregulation, somatic mutation</tspan>
    <tspan x="56" dy="15">frequency, and patient survival impact using TCGA-BRCA data (1,098 primary tumors, 112 normal controls).</tspan>
    <tspan x="56" dy="15">Oncogenes ERBB2, ESR1, and CCND1 were substantially upregulated in malignant tissue. TP53</tspan>
    <tspan x="56" dy="15">emerged as the predominant mutated gene (34.2%), underscoring critical genomic mechanisms.</tspan>
  </text>

  <!-- Two-Column Scientific Paper Layout -->
  <!-- Left Column: Introduction & Genomic Panel Table -->
  <g transform="translate(40, 430)">
    <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#0F172A">INTRODUCTION</text>
    
    <rect x="0" y="24" width="270" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="0" y="34" width="260" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="0" y="44" width="270" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="0" y="54" width="245" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="0" y="64" width="265" height="5" rx="2.5" fill="#E2E8F0" />

    <!-- Table: 17 Key Genes Investigated -->
    <rect x="0" y="85" width="270" height="175" fill="#F8FAFC" rx="4" stroke="#E2E8F0" />
    <rect x="0" y="85" width="270" height="22" fill="#E2E8F0" rx="4" />
    <text x="8" y="99" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#334155">TABLE 1. 17-GENE BREAST CANCER PANEL</text>

    <!-- Table Rows -->
    <g transform="translate(8, 120)" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#475569">
      <text x="0" y="0" font-weight="700" fill="#0F766E">Gene</text>
      <text x="60" y="0" font-weight="700" fill="#0F766E">Classification</text>
      <text x="160" y="0" font-weight="700" fill="#0F766E">Status (TCGA)</text>
      
      <line x1="-4" y1="5" x2="250" y2="5" stroke="#CBD5E1" stroke-width="0.7" />

      <text x="0" y="18" font-weight="600">ERBB2</text>
      <text x="60" y="18">RTK Oncogene</text>
      <text x="160" y="18" fill="#0D9488">Upregulated ↑</text>

      <text x="0" y="32" font-weight="600">ESR1</text>
      <text x="60" y="32">Estrogen Receptor</text>
      <text x="160" y="32" fill="#0D9488">Upregulated ↑</text>

      <text x="0" y="46" font-weight="600">CCND1</text>
      <text x="60" y="46">Cell Cycle D1</text>
      <text x="160" y="46" fill="#0D9488">Upregulated ↑</text>

      <text x="0" y="60" font-weight="600">TP53</text>
      <text x="60" y="60">Tumor Suppressor</text>
      <text x="160" y="60" fill="#DC2626">Mutated (34.2%)</text>

      <text x="0" y="74" font-weight="600">BRCA1/2</text>
      <text x="60" y="74">DNA Repair / HR</text>
      <text x="160" y="74">Somatic Var.</text>

      <text x="0" y="88" font-weight="600">CHEK2</text>
      <text x="60" y="88">Checkpoint Kinase</text>
      <text x="160" y="88" fill="#0D9488">Elevated Exp.</text>

      <text x="0" y="102" font-weight="600">MYC / RB1</text>
      <text x="60" y="102">Regulator / Checkpoint</text>
      <text x="160" y="102" fill="#64748B">Downregulated ↓</text>

      <text x="0" y="116" font-weight="600">PIK3CA</text>
      <text x="60" y="116">Lipid Kinase</text>
      <text x="160" y="116">Recurrent Mut.</text>
    </g>

    <text x="0" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#0F172A">METHODS: TCGA-BRCA COHORT</text>
    <rect x="0" y="290" width="270" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="0" y="300" width="250" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="0" y="310" width="265" height="5" rx="2.5" fill="#E2E8F0" />
  </g>

  <!-- Right Column: Results & Expression Heatmap / Barplot -->
  <g transform="translate(340, 430)">
    <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#0F172A">RESULTS &amp; DIFFERENTIAL EXPRESSION</text>

    <!-- Mini Scientific Plot -->
    <rect x="0" y="26" width="270" height="180" fill="#F8FAFC" rx="4" stroke="#E2E8F0" />
    <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748B">FIG 1. LOG2 FOLD CHANGE IN TUMOR VS NORMAL</text>

    <!-- Plot Axes -->
    <line x1="80" y1="58" x2="80" y2="175" stroke="#94A3B8" stroke-width="1" />
    <line x1="30" y1="175" x2="255" y2="175" stroke="#94A3B8" stroke-width="1" />

    <!-- Zero line (baseline) -->
    <line x1="120" y1="58" x2="120" y2="175" stroke="#CBD5E1" stroke-dasharray="2,2" stroke-width="1" />
    <text x="120" y="188" font-family="'JetBrains Mono', monospace" font-size="7" fill="#64748B" text-anchor="middle">0 (log2FC)</text>

    <!-- Bars -->
    <text x="75" y="74" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#334155" text-anchor="end">ERBB2</text>
    <rect x="120" y="65" width="95" height="11" rx="2" fill="#0D9488" />

    <text x="75" y="92" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#334155" text-anchor="end">ESR1</text>
    <rect x="120" y="83" width="110" height="11" rx="2" fill="#0F766E" />

    <text x="75" y="110" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#334155" text-anchor="end">CCND1</text>
    <rect x="120" y="101" width="80" height="11" rx="2" fill="#14B8A6" />

    <text x="75" y="128" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#334155" text-anchor="end">BRCA2</text>
    <rect x="120" y="119" width="45" height="11" rx="2" fill="#2DD4BF" />

    <text x="75" y="146" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#334155" text-anchor="end">MYC</text>
    <rect x="75" y="137" width="45" height="11" rx="2" fill="#F43F5E" />

    <text x="75" y="164" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#334155" text-anchor="end">RB1</text>
    <rect x="90" y="155" width="30" height="11" rx="2" fill="#E11D48" />

    <!-- Kaplan-Meier Survival Box Preview -->
    <rect x="0" y="218" width="270" height="100" fill="#F8FAFC" rx="4" stroke="#E2E8F0" />
    <text x="10" y="234" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748B">FIG 2. KAPLAN-MEIER OVERALL SURVIVAL</text>
    
    <!-- KM Curve Step Simulation -->
    <path d="M 25 285 L 60 285 L 60 270 L 110 270 L 110 255 L 170 255 L 170 248 L 245 248" fill="none" stroke="#0D9488" stroke-width="2" />
    <path d="M 25 285 L 50 285 L 50 262 L 95 262 L 95 248 L 150 248 L 150 238 L 245 238" fill="none" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="3,2" />
    <text x="180" y="275" font-family="'JetBrains Mono', monospace" font-size="7" fill="#0D9488">High Exp.</text>
    <text x="180" y="295" font-family="'JetBrains Mono', monospace" font-size="7" fill="#F43F5E">Low Exp.</text>
    <text x="10" y="308" font-family="'JetBrains Mono', monospace" font-size="7" fill="#94A3B8">TCGA-BRCA Survival (p &gt; 0.05)</text>
  </g>

  <!-- Footer Page Number -->
  <line x1="40" y1="800" x2="610" y2="800" stroke="#E2E8F0" stroke-width="1" />
  <text x="40" y="818" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">Journal of Emerging Investigators · www.emerginginvestigators.org</text>
  <text x="610" y="818" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8" text-anchor="end">Page 1 of 8</text>
</svg>
