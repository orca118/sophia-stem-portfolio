    <text x="165" y="213" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">Synaptic Vesicle</text>
    <text x="140" y="231" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">Neuroinflammation</text>
    <text x="120" y="249" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">Mitochondria</text>
    <text x="100" y="267" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">Calcium Signaling</text>
    <text x="80" y="285" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">Autophagy</text>
  </g>

