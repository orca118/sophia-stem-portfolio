    <text x="15" y="271" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">Compound C</text>
    <text x="130" y="271" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0D9488">-84.7</text>
    <text x="190" y="271" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">Kinase Inh.</text>

