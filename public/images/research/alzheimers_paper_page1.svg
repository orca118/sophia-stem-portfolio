
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 840" width="100%" height="100%">
  <!-- Document Sheet -->
  <rect width="650" height="840" fill="#FFFFFF" rx="4" />
  <rect x="0" y="0" width="650" height="840" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Journal Header Banner -->
  <rect x="40" y="35" width="570" height="50" fill="#F8FAFC" rx="4" stroke="#E2E8F0" stroke-width="1" />
  <text x="55" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="1">NATIONAL HIGH SCHOOL JOURNAL OF SCIENCE</text>
  <text x="55" y="74" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">NHSJS · RESEARCH ARTICLE · PUBLISHED 2026</text>
  <text x="595" y="65" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="end">OPEN ACCESS</text>

  <!-- Article Title -->
  <text x="40" y="130" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start">
    <tspan x="40" dy="0">Identifying Potential Drug Candidates for Alzheimer's</tspan>
    <tspan x="40" dy="26">Disease Using Transcriptomic Analysis</tspan>
  </text>

  <!-- Author & Affiliation -->
  <text x="40" y="186" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0D9488">Sophia Wang</text>
  <text x="40" y="202" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#64748B">Richard Montgomery High School, Rockville, MD · Class of 2028</text>
  <text x="40" y="217" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#0F766E">Research Mentor: Dr. Haiyan Lei · National Cancer Institute (NCI)</text>
  <line x1="40" y1="228" x2="610" y2="228" stroke="#E2E8F0" stroke-width="1" />

  <!-- Abstract Box -->
  <rect x="40" y="235" width="570" height="155" fill="#F0FDFA" rx="6" stroke="#CCFBF1" stroke-width="1" />
  <text x="55" y="258" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F766E">ABSTRACT</text>
  
  <text x="55" y="280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#334155">
    <tspan x="55" dy="0">Alzheimer's disease (AD) is a progressive neurodegenerative disorder with limited therapeutic</tspan>
    <tspan x="55" dy="16">options. In this investigation, public transcriptomic microarray and RNA-seq datasets from the Gene</tspan>
    <tspan x="55" dy="16">Expression Omnibus (GEO) were analyzed to identify differentially expressed genes across vulnerable</tspan>
    <tspan x="55" dy="16">brain regions (hippocampus and entorhinal cortex). Pathway enrichment analysis highlighted</tspan>
    <tspan x="55" dy="16">neuroinflammation, synaptic vesicle transport, and mitochondrial metabolism dysregulation.</tspan>
    <tspan x="55" dy="16">Computational drug-repurposing methodologies evaluated candidate reversal signatures,</tspan>
    <tspan x="55" dy="16">prioritizing small-molecule candidates for further prospective laboratory inquiry.</tspan>
  </text>

  <!-- Simulated Columns Layout of Paper -->
  <g transform="translate(40, 415)">
